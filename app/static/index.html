<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cartling</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; background: #0f172a; color: #e2e8f0; }
    #chat { border: 1px solid #334155; height: 480px; overflow-y: auto; padding: 16px; border-radius: 12px; background: #1e293b; }
    .msg { margin: 10px 0; padding: 10px 14px; border-radius: 10px; }
    .user { background: #3b82f6; margin-left: 20%; }
    .bot { background: #334155; margin-right: 20%; }
    #input { display: flex; margin-top: 12px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #1e293b; color: white; }
    button { margin-left: 8px; padding: 12px 20px; background: #22c55e; border: none; border-radius: 8px; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Cartling</h1>
  <div id="chat"></div>
  <div id="input">
    <input id="msg" placeholder="Describe what you want or say yes buy..." autofocus>
    <button onclick="send()">Send</button>
  </div>
  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("msg");
    let history = [];

    function addMsg(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.innerText = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      addMsg(text, "user");
      input.value = "";
      history.push({ role: "user", content: text });

      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history })
      });
      const data = await res.json();
      addMsg(data.reply, "bot");
      history.push({ role: "assistant", content: data.reply });
    }

    input.addEventListener("keypress", e => { if (e.key === "Enter") send(); });
  </script>
</body>
</html>
